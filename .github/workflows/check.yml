name: Check offline course

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_publication.py
      - run: python scripts/build.py
      - run: python scripts/check.py
      - run: python scripts/check_examples.py
      - name: Verify committed pages match their sources
        run: git diff --exit-code -- index.html lessons
